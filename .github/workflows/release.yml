name: Release Tauri Client

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLIC_PATH: ./

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.mjs ${{ github.ref_name }}
      - name: Skip version check on manual dispatch
        if: github.ref_type != 'tag'
        run: echo "workflow_dispatch 不校验 tag 版本"

  release-desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            rpm2cpio \
            cpio

      - name: Install frontend dependencies
        run: npm install

      - name: Build desktop bundles
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Extract changelog
        run: node scripts/extract-changelog.mjs ${{ github.ref_name }} > release-notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 易谱 ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/**/bundle/deb/yipu_*.deb
            src-tauri/target/**/bundle/rpm/yipu_*.rpm
            src-tauri/target/**/bundle/appimage/yipu_*.AppImage
            src-tauri/target/**/bundle/dmg/yipu_*.dmg
            src-tauri/target/**/bundle/nsis/yipu_*.exe
            src-tauri/target/**/bundle/msi/yipu_*.msi

  release-android:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize Android target
        run: npm run tauri android init -- --ci

      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "未配置 ANDROID_KEY_BASE64，跳过签名"
            exit 0
          fi
          cd src-tauri/gen/android
          echo "keyAlias=${ANDROID_KEY_ALIAS}" > keystore.properties
          echo "password=${ANDROID_KEY_PASSWORD}" >> keystore.properties
          echo "${ANDROID_KEY_BASE64}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build Android APK
        run: npm run tauri:android:build

      - name: Extract changelog
        run: node scripts/extract-changelog.mjs ${{ github.ref_name }} > release-notes.md

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 易谱 ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/yipu_*_android_aarch64.apk

  release-ios:
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm install

      - name: Install iOS signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_CERTIFICATE}" ] || [ -z "${IOS_CERTIFICATE_PASSWORD}" ] || [ -z "${IOS_MOBILE_PROVISION}" ] || [ -z "${APPLE_DEVELOPMENT_TEAM}" ]; then
            echo "缺少 iOS 签名 Secrets（IOS_CERTIFICATE、IOS_CERTIFICATE_PASSWORD、IOS_MOBILE_PROVISION、APPLE_DEVELOPMENT_TEAM）"
            echo "请按 README「iOS（免费个人账号）」配置后再发版"
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/ios-dev.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios.mobileprovision"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$PROFILE_PATH"
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          NAME="$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          cp "$PROFILE_PATH" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${UUID}.mobileprovision"
          {
            echo "IOS_PROFILE_UUID=${UUID}"
            echo "IOS_PROFILE_NAME=${NAME}"
          } >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Configure iOS manual signing
        env:
          IOS_PROFILE_UUID: ${{ env.IOS_PROFILE_UUID }}
          IOS_PROFILE_NAME: ${{ env.IOS_PROFILE_NAME }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: node scripts/configure-ios-ci-signing.mjs

      - name: Build iOS IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: >
          npm run tauri:ios:build -- --export-method debugging --
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=${{ env.IOS_PROFILE_UUID }}
          CODE_SIGN_IDENTITY="Apple Development"
          DEVELOPMENT_TEAM=${{ secrets.APPLE_DEVELOPMENT_TEAM }}

      - name: Extract changelog
        run: node scripts/extract-changelog.mjs ${{ github.ref_name }} > release-notes.md

      - name: Upload iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 易谱 ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/gen/apple/build/**/yipu_*_ios_aarch64.ipa
