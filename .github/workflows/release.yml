name: Release Tauri Client

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLIC_PATH: ./

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.mjs ${{ github.ref_name }}
      - name: Skip version check on manual dispatch
        if: github.ref_type != 'tag'
        run: echo "workflow_dispatch 不校验 tag 版本"

  release-desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            rpm2cpio \
            rpm-build \
            cpio

      - name: Install frontend dependencies
        run: npm install

      - name: Build desktop bundles
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Extract changelog
        run: node scripts/extract-changelog.mjs ${{ github.ref_name }} > release-notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 易谱 ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/**/bundle/deb/yipu_*.deb
            src-tauri/target/**/bundle/rpm/yipu_*.rpm
            src-tauri/target/**/bundle/appimage/yipu_*.AppImage
            src-tauri/target/**/bundle/dmg/yipu_*.dmg
            src-tauri/target/**/bundle/nsis/yipu_*.exe
            src-tauri/target/**/bundle/msi/yipu_*.msi

  release-android:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize Android target
        run: npm run tauri android init -- --ci

      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "未配置 ANDROID_KEY_BASE64，跳过签名"
            exit 0
          fi
          cd src-tauri/gen/android
          echo "keyAlias=${ANDROID_KEY_ALIAS}" > keystore.properties
          echo "password=${ANDROID_KEY_PASSWORD}" >> keystore.properties
          echo "${ANDROID_KEY_BASE64}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build Android APK
        run: npm run tauri:android:build

      - name: Extract changelog
        run: node scripts/extract-changelog.mjs ${{ github.ref_name }} > release-notes.md

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 易谱 ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/yipu_*_android_aarch64.apk

  release-ios:
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install frontend dependencies
        run: npm install

      - name: Build iOS IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: npm run tauri:ios:build -- --export-method debugging

      - name: Extract changelog
        run: node scripts/extract-changelog.mjs ${{ github.ref_name }} > release-notes.md

      - name: Upload iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 易谱 ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/gen/apple/build/**/yipu_*_ios_aarch64.ipa
