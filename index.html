<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto" data-scheme="light">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="将 MusicXML 曲谱转换为简谱，并导出 PDF">
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="易谱">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/fonts/NotoSansSC-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'NotoSansSC';
        src: url('/fonts/NotoSansSC-Regular.woff2') format('woff2'),
             url('/fonts/NotoSansSC-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'NotoSansSC';
        src: url('/fonts/NotoSansSC-Regular.woff2') format('woff2'),
             url('/fonts/NotoSansSC-Regular.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <title>易谱</title>
  </head>
  <body>
    <noscript>
      <strong>请启用 JavaScript 后继续使用「易谱」。</strong>
    </noscript>
    <div id="app">
      <div id="boot-fallback" style="padding:24px;font-size:16px;line-height:1.5;color:#8e8e93;font-family:sans-serif;">加载中…</div>
    </div>
    <script>
      (function () {
        var slowTimer = setTimeout(function () {
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          el.textContent = '仍在加载，首次启动可能较慢…';
        }, 15000);
        var failTimer = setTimeout(function () {
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          el.textContent =
            '加载超时。若使用系统代理，请将 localhost 加入 bypass；或先运行 npm run dev 预热后再试。';
        }, 60000);
        window.__bootFallbackTimers = [slowTimer, failTimer];

        window.addEventListener('error', function (e) {
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          el.textContent = '加载失败：' + (e.message || '未知错误');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          var reason = e.reason;
          el.textContent =
            '加载失败：' +
            (reason && reason.message ? reason.message : String(reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
