<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
    <script>
      (function () {
        var KEY = 'xml2jianpu:theme'
        var theme = 'auto'
        try {
          var stored = localStorage.getItem(KEY)
          if (stored === 'light' || stored === 'dark' || stored === 'auto') theme = stored
        } catch (e) { /* private mode */ }
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        if (theme === 'light' || theme === 'dark') {
          var bg = theme === 'dark' ? '#111113' : '#f9f9f9'
          root.setAttribute('data-scheme', theme)
          root.style.backgroundColor = bg
          var cs = document.querySelector('meta[name="color-scheme"]')
          if (cs) cs.setAttribute('content', theme)
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = metas.length - 1; i >= 0; i--) metas[i].parentNode.removeChild(metas[i])
          var meta = document.createElement('meta')
          meta.setAttribute('name', 'theme-color')
          meta.setAttribute('content', bg)
          document.head.appendChild(meta)
        }
        try {
          if (window.AndroidChrome && window.AndroidChrome.setThemePreference) {
            window.AndroidChrome.setThemePreference(theme)
          }
        } catch (e2) { /* bridge not ready */ }
        try {
          var handlers = window.webkit && window.webkit.messageHandlers
          if (handlers && handlers.xml2jianpuTheme) {
            handlers.xml2jianpuTheme.postMessage(theme)
          }
        } catch (e3) { /* not iOS */ }
      })()
    </script>
    <style>
      html, body { background: #f9f9f9; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        html:not([data-scheme='light']),
        html:not([data-scheme='light']) body {
          background: #111113;
          color-scheme: dark;
        }
      }
      html[data-scheme='light'],
      html[data-scheme='light'] body { background: #f9f9f9; color-scheme: light; }
      html[data-scheme='dark'],
      html[data-scheme='dark'] body { background: #111113; color-scheme: dark; }
    </style>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="description" content="将 MusicXML 曲谱转换为简谱，并导出 PDF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="易谱">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/fonts/NotoSansSC-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'NotoSansSC';
        src: url('/fonts/NotoSansSC-Regular.woff2') format('woff2'),
             url('/fonts/NotoSansSC-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'NotoSansSC';
        src: url('/fonts/NotoSansSC-Regular.woff2') format('woff2'),
             url('/fonts/NotoSansSC-Regular.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <title>易谱</title>
  </head>
  <body>
    <noscript>
      <strong>请启用 JavaScript 后继续使用「易谱」。</strong>
    </noscript>
    <div id="app">
      <div id="boot-fallback" style="padding:24px;font-size:16px;line-height:1.5;color:#8e8e93;font-family:sans-serif;">加载中…</div>
    </div>
    <script>
      (function () {
        var slowTimer = setTimeout(function () {
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          el.textContent = '仍在加载，首次启动可能较慢…';
        }, 15000);
        var failTimer = setTimeout(function () {
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          el.textContent =
            '加载超时。若使用系统代理，请将 localhost 加入 bypass；或先运行 npm run dev 预热后再试。';
        }, 60000);
        window.__bootFallbackTimers = [slowTimer, failTimer];

        window.addEventListener('error', function (e) {
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          el.textContent = '加载失败：' + (e.message || '未知错误');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var el = document.getElementById('boot-fallback');
          if (!el) return;
          var reason = e.reason;
          el.textContent =
            '加载失败：' +
            (reason && reason.message ? reason.message : String(reason));
        });
      })();
    </script>
    <script>
      // Chrome 61 及以下无 globalThis 全局绑定；须在 module 脚本前声明
      var globalThis = (function () {
        if (typeof self !== 'undefined') return self
        if (typeof window !== 'undefined') return window
        if (typeof global !== 'undefined') return global
        return Function('return this')()
      })()
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        try {
          if (window.AndroidChrome && window.AndroidChrome.requestSafeAreaSync) {
            window.AndroidChrome.requestSafeAreaSync()
          }
        } catch (e) { /* bridge not ready */ }
      })
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
