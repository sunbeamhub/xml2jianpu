[package]
name = "xml2jianpu"
version = "0.0.16"
description = "易谱"
authors = ["sunbeamhub"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"

# Apple's NSBundle.bundleWithIdentifier crashes on device when CFBundleDisplayName
# is non-ASCII (e.g. 易谱). Skip that lookup on iOS; see vendor/wry.
# iOS 16 also blocks reqwest to LAN IPs; skip the mobile dev proxy so WKWebView
# loads Vite the same way Safari does. See vendor/tauri.
[patch.crates-io]
wry = { path = "vendor/wry" }
tauri = { path = "vendor/tauri" }
